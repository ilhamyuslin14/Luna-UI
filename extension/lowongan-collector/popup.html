<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Luna Lowongan Collector</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 400px; font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1e293b; background: #fff; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; background: #0f172a; color: #fff; }
    header h1 { font-size: 14px; margin: 0; font-weight: 700; }
    header h1 span { color: #ff8d21; }
    .who { font-size: 11px; color: #94a3b8; display: flex; gap: 8px; align-items: center; }
    .who button { background: none; border: none; color: #fdba74; cursor: pointer; font-size: 11px; padding: 0; text-decoration: underline; }
    main { padding: 14px 16px 16px; max-height: 560px; overflow-y: auto; }
    [hidden] { display: none !important; }
    label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin: 10px 0 4px; }
    input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; color: #0f172a; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #ff8d21; box-shadow: 0 0 0 3px #ffedd5; }
    input.empty, textarea.empty { border-color: #f87171; background: #fef2f2; }
    textarea { min-height: 130px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { font-size: 11px; color: #94a3b8; margin-top: 3px; }
    .btn { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 8px; background: #ff8d21; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .btn:hover:not(:disabled) { background: #e87a13; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 12px; padding: 9px 11px; border-radius: 8px; font-size: 12px; }
    .msg.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .msg.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .msg.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    #existing-note, #similar-note { margin: 0 0 10px; }
    .empty-state { text-align: center; color: #64748b; padding: 28px 8px; }
    .empty-state b { display: block; color: #0f172a; margin-bottom: 4px; font-size: 14px; }
    .src { font-size: 11px; color: #64748b; word-break: break-all; }
    .logo-row { display: flex; gap: 10px; align-items: center; }
    .logo-prev { width: 40px; height: 40px; flex-shrink: 0; border: 1px solid #e2e8f0; border-radius: 9px; background: #f8fafc center / contain no-repeat; }
  </style>
</head>
<body>
  <header>
    <h1>Luna <span>Collector</span></h1>
    <div class="who" id="who" hidden>
      <span id="who-email"></span>
      <button id="btn-logout" type="button">Keluar</button>
    </div>
  </header>

  <main>
    <section id="view-loading"><div class="empty-state">Memuat…</div></section>

    <section id="view-login" hidden>
      <form id="form-login">
        <label for="login-email">Email super admin</label>
        <input id="login-email" type="email" autocomplete="username" required />
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password" autocomplete="current-password" required />
        <button class="btn" id="btn-login" type="submit">Masuk</button>
        <div class="msg err" id="login-error" hidden></div>
      </form>
    </section>

    <section id="view-empty" hidden>
      <div class="empty-state">
        <b>Belum ada lowongan yang terbuka</b>
        Di JobStreet, klik satu lowongan (panel detail di samping daftar juga bisa) atau buka halaman detailnya, lalu klik ikon extension ini lagi.
      </div>
    </section>

    <section id="view-form" hidden>
      <div class="msg warn" id="existing-note" hidden></div>
      <div class="msg info" id="similar-note" hidden></div>
      <div class="src" id="src-url"></div>

      <label for="f-title">Judul lowongan *</label>
      <input id="f-title" />
      <label for="f-company">Perusahaan *</label>
      <input id="f-company" />
      <label for="f-logo">Link logo perusahaan</label>
      <div class="logo-row">
        <div class="logo-prev" id="logo-prev" aria-hidden="true"></div>
        <input id="f-logo" placeholder="Kosong kalau logo tidak ditemukan" />
      </div>
      <label for="f-location">Lokasi</label>
      <input id="f-location" />
      <label for="f-category">Kategori</label>
      <input id="f-category" />

      <div class="row">
        <div>
          <label for="f-emp">Ikatan kerja</label>
          <select id="f-emp"></select>
        </div>
        <div>
          <label for="f-posted">Tanggal posting</label>
          <input id="f-posted" type="date" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="f-smin">Gaji minimum / bulan</label>
          <input id="f-smin" inputmode="numeric" placeholder="Rp 0" />
        </div>
        <div>
          <label for="f-smax">Gaji maksimum / bulan</label>
          <input id="f-smax" inputmode="numeric" placeholder="Rp 0" />
        </div>
      </div>
      <label for="f-stext">Gaji dalam teks</label>
      <input id="f-stext" placeholder="Kosong kalau gaji tidak ditampilkan" />
      <div class="hint" id="sal-hint"></div>

      <label for="f-desc">Deskripsi &amp; tanggung jawab</label>
      <textarea id="f-desc"></textarea>
      <div class="hint" id="desc-hint"></div>

      <button class="btn" id="btn-save" type="button">Simpan ke Luna</button>
      <div class="msg" id="save-msg" hidden></div>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Luna Lowongan Collector</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 340px; font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1e293b; background: #fff; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #0f172a; color: #fff; }
    header h1 { font-size: 14px; margin: 0; font-weight: 700; }
    header h1 span { color: #ff8d21; }
    .who { font-size: 11px; color: #94a3b8; display: flex; gap: 8px; align-items: center; }
    .who button { background: none; border: none; color: #fdba74; cursor: pointer; font-size: 11px; padding: 0; text-decoration: underline; }
    main { padding: 16px; }
    [hidden] { display: none !important; }
    label.f { display: block; font-size: 11px; font-weight: 600; color: #475569; margin: 10px 0 4px; }
    input[type=email], input[type=password] { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; color: #0f172a; background: #fff; }
    input:focus { outline: none; border-color: #ff8d21; box-shadow: 0 0 0 3px #ffedd5; }
    .btn { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 8px; background: #ff8d21; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .btn:hover:not(:disabled) { background: #e87a13; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 12px; padding: 9px 11px; border-radius: 8px; font-size: 12px; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .empty-state { text-align: center; color: #64748b; padding: 20px 8px; }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; }
    .switch-row b { display: block; font-size: 13px; color: #0f172a; }
    .switch-row small { display: block; color: #64748b; font-size: 11.5px; margin-top: 2px; }
    .switch { position: relative; flex-shrink: 0; width: 46px; height: 26px; }
    .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
    .track { position: absolute; inset: 0; border-radius: 999px; background: #cbd5e1; transition: background 0.18s ease; }
    .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform 0.18s ease; }
    .switch input:checked + .track { background: #ff8d21; }
    .switch input:checked + .track::after { transform: translateX(20px); }
    .switch input:focus-visible + .track { box-shadow: 0 0 0 3px #ffedd5; }
    .howto { margin: 14px 2px 0; padding: 0 0 0 18px; color: #64748b; font-size: 12px; }
    .howto li + li { margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Luna <span>Collector</span></h1>
    <div class="who" id="who" hidden>
      <span id="who-email"></span>
      <button id="btn-logout" type="button">Keluar</button>
    </div>
  </header>

  <main>
    <section id="view-loading"><div class="empty-state">Memuat…</div></section>

    <section id="view-login" hidden>
      <form id="form-login">
        <label class="f" for="login-email">Email super admin</label>
        <input id="login-email" type="email" autocomplete="username" required />
        <label class="f" for="login-pass">Password</label>
        <input id="login-pass" type="password" autocomplete="current-password" required />
        <button class="btn" id="btn-login" type="submit">Masuk</button>
        <div class="msg" id="login-error" hidden></div>
      </form>
    </section>

    <section id="view-main" hidden>
      <div class="switch-row">
        <div>
          <b>Collector di JobStreet dan Glints</b>
          <small id="switch-state">Nonaktif</small>
        </div>
        <label class="switch" aria-label="Aktifkan collector di JobStreet dan Glints">
          <input id="toggle-enabled" type="checkbox" />
          <span class="track"></span>
        </label>
      </div>
      <ol class="howto">
        <li>Nyalakan, lalu buka JobStreet atau Glints.</li>
        <li>Tombol Luna muncul di sisi kiri halaman.</li>
        <li>Buka satu lowongan, lalu klik <b>Lihat Detail</b> atau <b>Simpan</b>.</li>
      </ol>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>

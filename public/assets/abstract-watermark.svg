<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <g opacity="0.2">
    <!-- Security/Radar pulse concentric circles -->
    <circle cx="200" cy="200" r="180" stroke="#000" stroke-width="1.5" fill="none" />
    <circle cx="200" cy="200" r="150" stroke="#000" stroke-width="1.5" fill="none" stroke-dasharray="12 12" />
    <circle cx="200" cy="200" r="120" stroke="#000" stroke-width="1.5" fill="none" />
    <circle cx="200" cy="200" r="90" stroke="#000" stroke-width="1.5" fill="none" stroke-dasharray="6 6" />
    <circle cx="200" cy="200" r="60" stroke="#000" stroke-width="1.5" fill="none" />
    <circle cx="200" cy="200" r="30" stroke="#000" stroke-width="1.5" fill="none" stroke-dasharray="4 4" />
    
    <!-- Crosshairs for modern tech feel -->
    <line x1="20" y1="200" x2="380" y2="200" stroke="#000" stroke-width="1" stroke-dasharray="5 5" />
    <line x1="200" y1="20" x2="200" y2="380" stroke="#000" stroke-width="1" stroke-dasharray="5 5" />
    
    <!-- Minimalist accent dots -->
    <circle cx="200" cy="20" r="4" fill="#000" />
    <circle cx="200" cy="380" r="4" fill="#000" />
    <circle cx="20" cy="200" r="4" fill="#000" />
    <circle cx="380" cy="200" r="4" fill="#000" />
  </g>
</svg>
